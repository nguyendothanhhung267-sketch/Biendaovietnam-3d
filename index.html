<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Các vùng biển và thềm lục địa – mô phỏng 3D</title>
<style>
:root{--bg:#eaf3f7;--panel:#ffffffee;--ink:#12303d;--mute:#4d6a77;--line:#b9d0da;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a24;--panel:#10252fee;--ink:#e3f1f6;--mute:#93b0bc;--line:#2a4755}}
:root[data-theme="dark"]{--bg:#0b1a24;--panel:#10252fee;--ink:#e3f1f6;--mute:#93b0bc;--line:#2a4755}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro","Segoe UI",Roboto,sans-serif;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;display:block}
#c:active{cursor:grabbing}
header{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;pointer-events:none}
h1{font-size:clamp(16px,2.4vw,22px);margin:0;font-weight:700}
header p{margin:2px 0 0;font-size:12px;color:var(--mute)}
#panel{position:absolute;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(330px,calc(100% - 24px));max-height:42vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;backdrop-filter:blur(6px)}
.row{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.sw{flex:0 0 12px;height:12px;border-radius:3px;margin-top:3px}
.row b{display:block;font-size:13px}
.row span{color:var(--mute)}
.ctl{display:flex;flex-wrap:wrap;gap:10px;padding-top:8px;margin-top:6px;border-top:1px solid var(--line)}
.ctl label{display:flex;gap:4px;align-items:center;cursor:pointer}
.hint{position:absolute;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:11.5px;color:var(--mute);text-align:right;pointer-events:none}
@media (max-width:640px){.hint{display:none}}
#panel{width:auto;max-height:none;padding:6px 10px}.ctl{border:0;padding:0;margin:0}
#chips{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:12px;right:12px;display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
#chips button{flex:0 0 auto;border:1px solid var(--line);border-left:4px solid var(--ac);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font:inherit;font-size:12.5px;cursor:pointer}
#chips button.on{background:var(--ac);color:#fff}
#info{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 100px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(400px,calc(100% - 24px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--ac,#2f7fd1);border-radius:10px;padding:14px 16px 16px;font-size:14px;line-height:1.55;backdrop-filter:blur(8px);z-index:5}
#info[hidden]{display:none}
#info h2{margin:0 30px 2px 0;font-size:20px}
#info .rng{font-weight:600}
#info .src{font-size:12px;color:var(--mute);margin:2px 0 6px}
#info h3{font-size:14px;margin:14px 0 4px}
#info ul{margin:0;padding-left:18px}#info li{margin:5px 0}
#info .x{position:absolute;top:6px;right:6px;border:0;background:none;color:var(--ink);font-size:24px;line-height:1;cursor:pointer;padding:4px 8px}
body.open .hint{display:none}
@media (max-width:640px){#chips{top:calc(env(safe-area-inset-top,0px) + 84px)}#info{top:auto;height:50vh;left:12px;right:12px;width:auto}}
</style>
</head>
<body>
<canvas id="c" aria-label="Mô phỏng 3D mặt cắt các vùng biển"></canvas>
<header><h1>Các vùng biển và thềm lục địa của quốc gia ven biển</h1><p>Sơ đồ minh họa, không theo tỉ lệ thật</p></header>
<div id="panel">

<div class="ctl">
<label><input type="checkbox" id="tLab" checked>Nhãn</label>
<label><input type="checkbox" id="tAir" checked>Không phận</label>
<label><input type="checkbox" id="tRot" checked>Tự xoay</label>
</div>
</div>
<div id="chips"></div>
<aside id="info" hidden><button class="x" aria-label="Đóng">×</button><h2></h2><div class="rng"></div><div class="src"></div><div class="bd"></div></aside>
<div class="hint">Bấm vào từng vùng hoặc nhãn để xem kiến thức · kéo để xoay · cuộn để phóng to</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var dark=matchMedia('(prefers-color-scheme:dark)').matches;
var cv=document.getElementById('c');
var R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene();
S.background=new THREE.Color(dark?0x0b1a24:0xeaf3f7);
var cam=new THREE.PerspectiveCamera(40,1,0.1,400);
S.add(new THREE.HemisphereLight(0xffffff,dark?0x233a48:0x9fb7c3,0.95));
var dl=new THREE.DirectionalLight(0xffffff,0.7);dl.position.set(20,40,30);S.add(dl);

var W=14;
var P=[[-18,3.2],[-12,2.2],[-7,0.9],[-3,0.1],[0,-0.3],[14,-1.2],[30,-2.6],[36,-6.2],[44,-7],[56,-7.2]];
function sy(x){for(var i=0;i<P.length-1;i++){if(x<=P[i+1][0]){var t=(x-P[i][0])/(P[i+1][0]-P[i][0]);return P[i][1]+t*(P[i+1][1]-P[i][1]);}}return P[P.length-1][1];}

// terrain
var sh=new THREE.Shape();sh.moveTo(-18,-9);
P.forEach(function(p){sh.lineTo(p[0],p[1]);});
sh.lineTo(56,-9);sh.lineTo(-18,-9);
var tg=new THREE.ExtrudeGeometry(sh,{depth:W,bevelEnabled:false});tg.translate(0,0,-W/2);
function strata(){var c=document.createElement('canvas');c.width=c.height=256;var g=c.getContext('2d');var cl=dark?['#6f5336','#80603d','#5d452d','#8a6a45','#74583a']:['#c99a62','#b98650','#d9ae78','#a8763f','#c28f58'];g.fillStyle=cl[0];g.fillRect(0,0,256,256);for(var i=0;i<14;i++){g.fillStyle=cl[i%cl.length];g.beginPath();g.moveTo(0,i*18);for(var x=0;x<=256;x+=16)g.lineTo(x,i*18+Math.sin(x*0.05+i)*5);g.lineTo(256,i*18+24);g.lineTo(0,i*18+24);g.fill();}for(i=0;i<600;i++){g.fillStyle='rgba(60,35,15,.22)';g.fillRect(Math.random()*256,Math.random()*256,2,2);}var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(0.08,0.08);return t;}
var terrain=new THREE.Mesh(tg,new THREE.MeshLambertMaterial({map:strata()}));
S.add(terrain);
// grass cap on land
var land=new THREE.Mesh(new THREE.BoxGeometry(15,0.12,W+0.02),new THREE.MeshLambertMaterial({color:0x5f9a4e}));
land.position.set(-10.5,2.55,0);land.rotation.z=-0.19;S.add(land);

// zone volumes
var groups={lab:[],air:[]};
var ZN={},RB=[],LID={'Nội thủy':'noithuy','Lãnh hải':'lanhhai','12 hải lý':'lanhhai','Tiếp giáp lãnh hải':'tiepgiap','24 hải lý':'tiepgiap','Vùng đặc quyền kinh tế':'eez','200 hải lý':'eez','Biển cả':'bien','Đường cơ sở':'coso','Thềm lục địa địa chất':'them','Thềm lục địa pháp lý (đến 350 hải lý)':'them'};
function zone(x0,x1,y0,y1,col,op,air,id){
var g=new THREE.BoxGeometry(x1-x0,y1-y0,W);
var m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false}));
m.position.set((x0+x1)/2,(y0+y1)/2,0);S.add(m);
var e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.8}));
e.position.copy(m.position);S.add(e);
if(air){groups.air.push(m,e);}if(id){m.userData.id=id;ZN[id]={m:m,op:op};}
}
zone(-3,0,-9,0,0x4aa3a0,0.38,false,'noithuy');
zone(0,8,-9,0,0x2f7fd1,0.32,false,'lanhhai');
zone(8,14,-9,0,0x7a63d0,0.32,false,'tiepgiap');
zone(14,30,-9,0,0x2fb36d,0.26,false,'eez');
zone(30,56,-9,0,0x7b8a97,0.22,false,'bien');
// airspace
zone(-18,8,0,4.5,0x2f7fd1,0.10,true);
zone(8,56,0,4.5,0x7b8a97,0.08,true);

// shelf ribbons
function ribbon(x0,x1,col,off){
var pos=[],idx=[],n=0;
for(var x=x0;x<=x1+0.001;x+=0.5){var y=sy(x)+off;pos.push(x,y,-W/2-0.01,x,y,W/2+0.01);if(n>0){var a=(n-1)*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}n++;}
var g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);
var m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:col,side:THREE.DoubleSide}));S.add(m);m.userData.id='them';m.userData.c=col;RB.push(m);
}
ribbon(0,30,0xe8a33a,0.05);
ribbon(30,44,0xf2c36b,0.05);

// sea surface
var anim=[],seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647;}
function mat(c){return new THREE.MeshLambertMaterial({color:c});}
// animated waves
var wg=new THREE.PlaneGeometry(59,W,59,14);
var wm=new THREE.Mesh(wg,new THREE.MeshPhongMaterial({color:dark?0x2a7fb0:0x3fa4d8,transparent:true,opacity:0.6,shininess:90,side:THREE.DoubleSide,depthWrite:false}));
wm.rotation.x=-Math.PI/2;wm.position.set(26.5,0.03,0);S.add(wm);
anim.push(function(t){var p=wg.attributes.position;for(var i=0;i<p.count;i++){var x=p.getX(i),y=p.getY(i);p.setZ(i,Math.sin(x*0.7+t*0.002)*0.09+Math.cos(y*1.1+t*0.0016)*0.07);}p.needsUpdate=true;wg.computeVertexNormals();});
// fish & whales
function fish(x0,y0,z,col,sp,rg,sc){sc=sc||1;var g=new THREE.Group();var b=new THREE.Mesh(new THREE.ConeGeometry(0.25,0.9,6),mat(col));b.rotation.z=-Math.PI/2;g.add(b);var tl=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.45,4),mat(col));tl.rotation.z=Math.PI/2;tl.position.x=-0.6;g.add(tl);g.scale.setScalar(sc);S.add(g);
anim.push(function(t){var a=t*sp+x0;var x=x0+Math.sin(a)*rg;g.position.set(x,Math.min(-0.25,Math.max(y0,sy(x)+0.5*sc))+Math.sin(t*0.003+x0)*0.12,z);g.rotation.y=Math.cos(a)>0?0:Math.PI;tl.rotation.y=Math.sin(t*0.01+x0)*0.5;});}
var fc=[0xff9a3c,0xffd34e,0xf06a6a,0x66d1c1,0xb7e36a];
for(var i=0;i<16;i++)fish(3+rnd()*47,-0.7-rnd()*3.2,(rnd()-0.5)*10,fc[i%5],0.0004+rnd()*0.0006,2+rnd()*3);
fish(40,-3.4,2,0x56708c,0.0002,6,4);fish(47,-4.2,-2.5,0x6b819b,0.00015,5,3.2);
// bubbles
var NB=70,bp=new Float32Array(NB*3);for(i=0;i<NB;i++){bp[i*3]=1+rnd()*52;bp[i*3+1]=-rnd()*6;bp[i*3+2]=(rnd()-0.5)*12;}
var bg=new THREE.BufferGeometry();bg.setAttribute('position',new THREE.BufferAttribute(bp,3));
S.add(new THREE.Points(bg,new THREE.PointsMaterial({color:0xffffff,size:0.14,transparent:true,opacity:0.7,depthWrite:false})));
anim.push(function(){for(var i=0;i<NB;i++){var x=bp[i*3];bp[i*3+1]+=0.012;if(bp[i*3+1]>-0.05||bp[i*3+1]<sy(x)){bp[i*3+1]=sy(x)+0.1;}}bg.attributes.position.needsUpdate=true;});
// kelp, coral, rocks
var kelp=[];for(i=0;i<34;i++){var kx=1+rnd()*28,kh=0.8+rnd()*1.1,k=new THREE.Mesh(new THREE.ConeGeometry(0.09,kh,4),mat(i%2?0x2e9a5a:0x4cb36a));k.position.set(kx,sy(kx)+kh/2,(rnd()-0.5)*12);S.add(k);kelp.push(k);}
anim.push(function(t){kelp.forEach(function(k,i){k.rotation.z=Math.sin(t*0.002+i)*0.25;});});
var cc=[0xff7a9c,0xff9a3c,0xd86bd9,0xffd34e];
for(i=0;i<45;i++){var ox=1+rnd()*28,co=new THREE.Mesh(new THREE.IcosahedronGeometry(0.13+rnd()*0.16,0),mat(cc[i%4]));co.position.set(ox,sy(ox)+0.1,(rnd()-0.5)*12.5);S.add(co);}
for(i=0;i<22;i++){var rx=26+rnd()*28,ro=new THREE.Mesh(new THREE.DodecahedronGeometry(0.2+rnd()*0.4,0),mat(0x6d7780));ro.scale.y=0.6;ro.position.set(rx,sy(rx)+0.1,(rnd()-0.5)*12.5);S.add(ro);}
// trees on land
for(var tx=-17;tx<-5.5;tx+=1.1){var tz=(rnd()-0.5)*11,ty=sy(tx);var tr=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,0.5,5),mat(0x6b4a2b));tr.position.set(tx,ty+0.25,tz);var cr=new THREE.Mesh(new THREE.ConeGeometry(0.5,1.3,7),mat(0x2f8a45));cr.position.set(tx,ty+1.05,tz);S.add(tr,cr);}
// lighthouse
var lx=-4.2,ly=sy(lx);
[[0.45,0.35,0xffffff],[0.4,0.3,0xd9483b],[0.35,0.3,0xffffff],[0.3,0.3,0xd9483b]].forEach(function(a,j){var m=new THREE.Mesh(new THREE.CylinderGeometry(a[0]*0.8,a[0],a[1]*2.4,10),mat(a[2]));m.position.set(lx,ly+0.4+j*0.85,-3);S.add(m);});
var lamp=new THREE.Mesh(new THREE.SphereGeometry(0.25,10,8),new THREE.MeshBasicMaterial({color:0xffe066}));lamp.position.set(lx,ly+3.9,-3);S.add(lamp);
var piv=new THREE.Group();piv.position.copy(lamp.position);var bm=new THREE.Mesh(new THREE.ConeGeometry(1.2,6,16,1,true),new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:0.22,depthWrite:false,side:THREE.DoubleSide}));bm.rotation.z=Math.PI/2;bm.position.x=3;piv.add(bm);S.add(piv);anim.push(function(t){piv.rotation.y=t*0.002;});
// oil rig
var ox2=24,oz=-3,oyb=sy(ox2),rig=new THREE.Group();
[[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(a){var l=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,1.7-oyb,6),mat(0xe0a02a));l.position.set(a[0]*1.1,(1.7+oyb)/2,a[1]*1.1);rig.add(l);});
var dk=new THREE.Mesh(new THREE.BoxGeometry(3,0.3,3),mat(0xd9483b));dk.position.y=1.8;rig.add(dk);
var dr=new THREE.Mesh(new THREE.ConeGeometry(0.4,1.8,4),mat(0xf2c36b));dr.position.set(-0.6,2.85,0);rig.add(dr);
var fl=new THREE.Mesh(new THREE.SphereGeometry(0.22,8,6),new THREE.MeshBasicMaterial({color:0xff8a1f}));fl.position.set(1.1,2.5,1.1);rig.add(fl);
rig.position.set(ox2,0,oz);S.add(rig);anim.push(function(t){fl.scale.setScalar(1+Math.sin(t*0.02)*0.3);});
// sun, clouds, plane
var sun=new THREE.Mesh(new THREE.SphereGeometry(2,20,16),new THREE.MeshBasicMaterial({color:dark?0xdfe8ff:0xffd96a}));sun.position.set(-26,20,-14);S.add(sun);
for(i=0;i<6;i++){(function(i){var g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:dark?0.5:0.92});for(var j=0;j<4;j++){var s=new THREE.Mesh(new THREE.SphereGeometry(1+rnd()*0.8,10,8),m);s.position.set(j*1.4,rnd()*0.5,rnd());s.scale.y=0.55;g.add(s);}var x0=rnd()*80,cy=8.5+rnd()*4,cz=(rnd()-0.5)*18;S.add(g);anim.push(function(t){g.position.set(((x0+t*0.002)%80)-22,cy,cz);});})(i);}
var pl=new THREE.Group(),pm=mat(0xffffff);var fu=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.14,2.2,8),pm);fu.rotation.z=Math.PI/2;pl.add(fu);pl.add(new THREE.Mesh(new THREE.BoxGeometry(0.7,0.05,3),pm));var pt=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.5,0.05),mat(0xd9483b));pt.position.set(-0.95,0.3,0);pl.add(pt);S.add(pl);
anim.push(function(t){var a=t*0.0003,x=31+Math.sin(a)*20;pl.position.set(x,3.3,-3);pl.rotation.y=Math.cos(a)>0?0:Math.PI;});

// ship
var ship=new THREE.Group();
function box(w,h,d,c,x,y,z){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);ship.add(m);}
box(3.4,0.7,1.2,0xf4f4f4,0,0.2,0);box(1.4,0.8,1,0xffffff,-0.5,0.95,0);box(0.3,0.6,0.3,0xd9483b,0.4,1.3,0);
ship.position.set(21,0,1);S.add(ship);
// port buildings
var cx=[-9,-7.6,-6.4,-5.2];
cx.forEach(function(x,i){var h=0.8+((i*7)%3)*0.5;var b=new THREE.Mesh(new THREE.BoxGeometry(0.9,h,1.2),new THREE.MeshLambertMaterial({color:0xdfe6ea}));b.position.set(x,sy(x)+h/2+0.05,-1+i*0.7);S.add(b);});

// labels
function label(txt,x,y,z,col,sc,kind){
var c=document.createElement('canvas');c.width=640;c.height=100;var g=c.getContext('2d');
g.font='600 38px "Segoe UI",Roboto,Arial,sans-serif';
var tw=Math.min(g.measureText(txt).width+40,620);
g.fillStyle=dark?'rgba(10,25,33,.85)':'rgba(255,255,255,.9)';
var x0=(640-tw)/2;g.beginPath();g.roundRect?g.roundRect(x0,14,tw,72,16):g.rect(x0,14,tw,72);g.fill();
g.lineWidth=4;g.strokeStyle=col;g.stroke();
g.fillStyle=dark?'#e8f4f8':'#12303d';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,320,51,tw-30);
var t=new THREE.CanvasTexture(c);
var s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
s.scale.set(sc*6.4,sc*1,1);s.position.set(x,y,z);s.renderOrder=10;S.add(s);groups.lab.push(s);if(LID[txt])s.userData.id=LID[txt];
}
label('Nội thủy',-1.5,5.6,0,'#4aa3a0',1.5);
label('Lãnh hải',4,5.6,0,'#2f7fd1',1.5);
label('Tiếp giáp lãnh hải',11,6.9,0,'#7a63d0',1.5);
label('Vùng đặc quyền kinh tế',22,5.6,0,'#2fb36d',1.7);
label('Biển cả',43,5.6,0,'#7b8a97',1.5);
label('Không phận quốc gia',-4,3.6,0,'#2f7fd1',1.3);
label('Không phận quốc tế',38,3.6,0,'#7b8a97',1.3);
label('Đường cơ sở',0,-10.4,W/2,'#12303d',1.2);
label('12 hải lý',8,-10.4,W/2,'#2f7fd1',1.2);
label('24 hải lý',14,-10.4,W/2,'#7a63d0',1.2);
label('200 hải lý',30,-10.4,W/2,'#2fb36d',1.2);
label('Thềm lục địa địa chất',15,-4.6,0,'#e8a33a',1.4);
label('Thềm lục địa pháp lý (đến 350 hải lý)',41,-4,0,'#e8a33a',1.6);
label('Đất liền',-13,6,0,'#5f9a4e',1.3);

// vertical marker poles
[[0,'#12303d'],[8,'#2f7fd1'],[14,'#7a63d0'],[30,'#2fb36d'],[44,'#e8a33a']].forEach(function(a){
var g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(a[0],-9.4,W/2),new THREE.Vector3(a[0],-9.4,W/2),new THREE.Vector3(a[0],-8.6,W/2)]);
});

// toggles
function bind(id,fn){var e=document.getElementById(id);e.addEventListener('change',function(){fn(e.checked);});}
bind('tLab',function(v){groups.lab.forEach(function(o){o.visible=v;});});
bind('tAir',function(v){groups.air.forEach(function(o){o.visible=v;});});
var rot=true;bind('tRot',function(v){rot=v;});

// kiến thức từng vùng
var D={
coso:{t:'Đường cơ sở',c:'#6b8a99',x:0,r:'Mốc để tính chiều rộng các vùng biển',n:'UNCLOS 1982 · Luật Biển Việt Nam 2012',s:[['Khái niệm',['Đường ranh giới pháp lý cơ bản do quốc gia ven biển vạch ra, dùng làm căn cứ để tính chiều rộng của lãnh hải và các vùng biển khác ra phía biển.']],['Tại Việt Nam',['Đường cơ sở dùng để tính chiều rộng lãnh hải là đường cơ sở thẳng do Chính phủ công bố, gồm 11 điểm nối từ đảo Hòn Nhạn (Kiên Giang) đến đảo Cồn Cỏ (Quảng Trị).','Ở Vịnh Bắc Bộ, đường cơ sở xác định theo Hiệp định phân định Vịnh Bắc Bộ năm 2000.']]]},
noithuy:{t:'Nội thủy',c:'#4aa3a0',x:-1.5,r:'Phía bên trong đường cơ sở',n:'UNCLOS Điều 8 · Luật Biển Việt Nam 2012 Điều 9',s:[['Khái niệm và phạm vi',['Vùng nước tiếp giáp với bờ biển, nằm bên trong đường cơ sở và là bộ phận lãnh thổ của quốc gia.','Gồm vùng nước cảng biển, vũng tàu, cửa sông, vịnh và vùng nước giữa bờ biển với đường cơ sở.']],['Chế độ pháp lý và quyền',['Chủ quyền hoàn toàn, tuyệt đối và đầy đủ đối với vùng nước, đáy biển, lòng đất dưới đáy biển và vùng trời phía trên, tương tự đất liền.','Tàu thuyền, phương tiện bay nước ngoài muốn ra vào, hoạt động phải xin phép trước và tuân thủ pháp luật của quốc gia ven biển.','Toàn quyền tài phán (hành chính, hình sự, dân sự) với vi phạm trên tàu nước ngoài; tàu quân sự và tàu nhà nước phi thương mại được miễn trừ tư pháp nhưng vẫn phải tuân thủ quy định ra vào, hoạt động.']],['Nghĩa vụ',['Công bố công khai quy định, thủ tục ra vào cảng biển và nội thủy.','Bảo đảm an toàn hàng hải, duy tu luồng lạch, tìm kiếm cứu nạn và bảo vệ môi trường biển.']]]},
lanhhai:{t:'Lãnh hải',c:'#2f7fd1',x:4,r:'Rộng tối đa 12 hải lý tính từ đường cơ sở',n:'UNCLOS Điều 2, 3 · Luật Biển Việt Nam 2012 Điều 11, 12',s:[['Khái niệm và phạm vi',['Vùng biển rộng không vượt quá 12 hải lý (1 hải lý = 1.852 m) tính từ đường cơ sở ra phía biển.','Ranh giới phía ngoài của lãnh hải là biên giới quốc gia trên biển.']],['Chế độ pháp lý và quyền',['Chủ quyền đầy đủ và toàn vẹn đối với lãnh hải, vùng trời, đáy biển và lòng đất dưới đáy biển.','Ban hành luật lệ và kiểm soát: an toàn hàng hải, bảo vệ cáp ngầm, bảo tồn tài nguyên sinh vật, nghiên cứu khoa học, bảo vệ môi trường, phòng chống buôn lậu và nhập cư trái phép.']],['Nghĩa vụ: quyền đi qua không gây hại',['Phải tôn trọng quyền đi qua không gây hại của tàu thuyền nước ngoài: đi nhanh chóng, liên tục, không dừng hay thả neo (trừ sự cố bất khả kháng) và không phương hại hòa bình, trật tự, an ninh.','Tàu ngầm và phương tiện đi ngầm khác phải đi nổi và treo cờ quốc tịch.','Theo Luật Biển Việt Nam, tàu quân sự nước ngoài phải thông báo trước cho cơ quan có thẩm quyền.','Không được cản trở việc đi qua không gây hại và phải thông báo mọi nguy hiểm hàng hải đã biết.','Lưu ý: vùng trời trên lãnh hải thuộc chủ quyền tuyệt đối, phương tiện bay nước ngoài chưa được phép thì không có quyền bay qua.']]]},
tiepgiap:{t:'Vùng tiếp giáp lãnh hải',c:'#7a63d0',x:11,r:'12–24 hải lý tính từ đường cơ sở',n:'UNCLOS Điều 33 · Luật Biển Việt Nam 2012 Điều 13, 14',s:[['Khái niệm và phạm vi',['Vùng biển tiếp liền và nằm ngoài lãnh hải, rộng không quá 12 hải lý tính từ ranh giới ngoài lãnh hải (tối đa 24 hải lý từ đường cơ sở).']],['Chế độ pháp lý và quyền',['Không có chủ quyền lãnh thổ; quốc gia thực hiện quyền kiểm soát cần thiết.','Ngăn ngừa và trừng trị vi phạm về hải quan, thuế khóa, y tế và nhập cư xảy ra trên lãnh thổ hoặc trong lãnh hải.','Theo Luật Biển Việt Nam, còn kiểm soát các vi phạm về an ninh, quốc phòng và bảo vệ hiện vật khảo cổ, lịch sử.']],['Nghĩa vụ',['Tôn trọng quyền tự do hàng hải, tự do hàng không, tự do đặt cáp và ống dẫn ngầm của các quốc gia khác, vì về pháp lý vùng này chồng lên phần bên trong của vùng đặc quyền kinh tế.']]]},
eez:{t:'Vùng đặc quyền kinh tế (EEZ)',c:'#2fb36d',x:22,r:'Cùng lãnh hải rộng tối đa 200 hải lý từ đường cơ sở',n:'UNCLOS Điều 55, 57 · Luật Biển Việt Nam 2012 Điều 15',s:[['Khái niệm và phạm vi',['Vùng biển tiếp liền và nằm ngoài lãnh hải, hợp với lãnh hải thành vùng rộng tối đa 200 hải lý tính từ đường cơ sở.','Bản thân EEZ rộng tối đa 188 hải lý tính từ ranh giới ngoài lãnh hải.']],['Chế độ pháp lý và quyền',['Quyền chủ quyền về kinh tế: thăm dò, khai thác, quản lý và bảo tồn tài nguyên sinh vật (hải sản) và không sinh vật (khoáng sản, năng lượng nước, hải lưu, gió) ở vùng nước trên đáy biển, đáy biển và lòng đất dưới đáy biển.','Quyền tài phán chuyên biệt: đảo nhân tạo, thiết bị và công trình trên biển; nghiên cứu khoa học biển; bảo vệ và gìn giữ môi trường biển.','Quyền thực thi pháp luật: khám xét, kiểm tra, bắt giữ và khởi tố tư pháp tàu nước ngoài đánh bắt hải sản hoặc khai thác tài nguyên trái phép.']],['Nghĩa vụ',['Tôn trọng tự do hàng hải, hàng không, đặt cáp và ống dẫn ngầm của mọi quốc gia, kể cả quốc gia không có biển.','Quản lý, bảo tồn nguồn lợi sinh vật biển, tránh khai thác quá mức.','Nếu không khai thác hết sản lượng cho phép, cần xem xét cho quốc gia khác (nhất là quốc gia không có biển hoặc bất lợi về địa lý trong khu vực) khai thác phần dư thông qua điều ước quốc tế.']]]},
them:{t:'Thềm lục địa',c:'#e8a33a',x:24,r:'Tối thiểu 200 hải lý, tối đa 350 hải lý',n:'UNCLOS Điều 76 · Luật Biển Việt Nam 2012 Điều 17',s:[['Khái niệm và phạm vi',['Gồm đáy biển và lòng đất dưới đáy biển bên ngoài lãnh hải, trên toàn bộ phần kéo dài tự nhiên của lãnh thổ đất liền đến bờ ngoài của rìa lục địa, hoặc đến cách đường cơ sở 200 hải lý nếu rìa lục địa ở gần hơn.','Nếu rìa lục địa kéo dài tự nhiên vượt 200 hải lý, có thể mở rộng nhưng không quá 350 hải lý từ đường cơ sở, hoặc không quá 100 hải lý từ đường đẳng sâu 2.500 m.','Chỉ gồm đáy biển và lòng đất, không gồm vùng nước bên trên.']],['Chế độ pháp lý và quyền',['Quyền chủ quyền về thăm dò và khai thác tài nguyên thiên nhiên.','Quyền có tính đặc quyền và đương nhiên: nếu quốc gia không thăm dò hay khai thác thì không ai được làm nếu chưa có sự đồng ý rõ ràng; không phụ thuộc chiếm hữu thực sự hay danh nghĩa, cũng không cần tuyên bố.','Tài nguyên gồm khoáng sản (dầu mỏ, khí đốt, kim loại...) và sinh vật loài định cư (san hô, trai, bào ngư...).','Đặc quyền cho phép và quy định việc khoan vì mọi mục đích; có quyền tài phán đối với đảo nhân tạo và công trình trên thềm lục địa.']],['Nghĩa vụ',['Không được đụng chạm đến chế độ pháp lý của vùng nước hoặc vùng trời phía trên (EEZ hoặc biển cả).','Không cản trở vô lý việc hàng hải, đánh bắt cá, đặt và bảo dưỡng cáp, ống dẫn ngầm của quốc gia khác; tuyến ống dẫn ngầm phải được quốc gia ven biển thỏa thuận.','Với phần mở rộng vượt 200 hải lý: đóng góp bằng tiền hoặc hiện vật cho cộng đồng quốc tế thông qua Cơ quan Quyền lực Đáy đại dương (ISA) từ năm thứ 6 sau khi bắt đầu khai thác tài nguyên không sinh vật.']]]},
bien:{t:'Biển cả',c:'#7b8a97',x:42,r:'Ngoài các vùng biển thuộc quyền tài phán quốc gia',n:'Kiến thức bổ sung, không có trong tài liệu bạn cung cấp',s:[['Tóm tắt',['Là vùng biển nằm ngoài EEZ, thuộc cộng đồng quốc tế; không quốc gia nào được đặt chủ quyền.','Mọi quốc gia đều có quyền tự do hàng hải, hàng không, đặt cáp và ống dẫn ngầm.']]]}
};
var ORD=['coso','noithuy','lanhhai','tiepgiap','eez','them','bien'];
var info=document.getElementById('info'),chips=document.getElementById('chips'),sel=null,goal=19;
var bl=new THREE.Mesh(new THREE.PlaneGeometry(W,9),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.35,side:THREE.DoubleSide,depthWrite:false}));
bl.rotation.y=Math.PI/2;bl.position.set(0,-4.5,0);bl.visible=false;S.add(bl);
function mark(){[].forEach.call(chips.children,function(b){b.classList.toggle('on',b.dataset.id===sel);});bl.visible=sel==='coso';}
function pick(id){var d=D[id];sel=id;info.hidden=false;document.body.classList.add('open');
info.style.setProperty('--ac',d.c);info.querySelector('h2').textContent=d.t;
var r=info.querySelector('.rng');r.textContent=d.r;r.style.color=d.c;
info.querySelector('.src').textContent=d.n;
info.querySelector('.bd').innerHTML=d.s.map(function(s){return '<h3>'+s[0]+'</h3><ul>'+s[1].map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>';}).join('');
info.scrollTop=0;goal=d.x;mark();}
function closeInfo(){sel=null;info.hidden=true;document.body.classList.remove('open');mark();}
info.querySelector('.x').onclick=closeInfo;
ORD.forEach(function(id){var b=document.createElement('button');b.textContent=D[id].t;b.dataset.id=id;b.style.setProperty('--ac',D[id].c);b.onclick=function(){pick(id);};chips.appendChild(b);});
anim.push(function(t){for(var k in ZN){ZN[k].m.material.opacity=ZN[k].op+(k===sel?0.2+Math.sin(t*0.004)*0.08:0);}
RB.forEach(function(m){m.material.color.setHex(sel==='them'?0xfff2b8:m.userData.c);});tgt.x+=(goal-tgt.x)*0.05;});
var rc=new THREE.Raycaster(),dn=null;
cv.addEventListener('pointerdown',function(e){dn=[e.clientX,e.clientY];});
cv.addEventListener('pointerup',function(e){
if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)return;
var r=cv.getBoundingClientRect();
rc.setFromCamera(new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1),cam);
var L=groups.lab.filter(function(o){return o.visible&&o.userData.id;}),Z=Object.keys(ZN).map(function(k){return ZN[k].m;});
var h=rc.intersectObjects(L)[0]||rc.intersectObjects(Z.concat(RB))[0];
if(!h)return;var id=h.object.userData.id,x=h.point.x;
if(!h.object.isSprite&&h.point.y<=sy(x)+0.1){id=x<0?'noithuy':x<8?'lanhhai':x<=44?'them':id;}
pick(id);});
// orbit
var th=0.55,ph=1.2,rad=68,tgt=new THREE.Vector3(19,-1.5,0);
var pts={},pd=0;
function upd(){
cam.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th));
cam.lookAt(tgt);
}
cv.addEventListener('pointerdown',function(e){cv.setPointerCapture(e.pointerId);pts[e.pointerId]=[e.clientX,e.clientY];rot=false;document.getElementById('tRot').checked=false;});
cv.addEventListener('pointermove',function(e){
if(!pts[e.pointerId])return;
var k=Object.keys(pts);
if(k.length===1){th-=(e.clientX-pts[e.pointerId][0])*0.006;ph=Math.max(0.25,Math.min(1.7,ph-(e.clientY-pts[e.pointerId][1])*0.006));}
pts[e.pointerId]=[e.clientX,e.clientY];
if(k.length===2){var a=pts[k[0]],b=pts[k[1]];var d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)rad=Math.max(20,Math.min(130,rad*pd/d));pd=d;}
});
function up(e){delete pts[e.pointerId];pd=0;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',function(e){e.preventDefault();rad=Math.max(20,Math.min(130,rad*(1+e.deltaY*0.001)));},{passive:false});

function size(){var w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;
rad=Math.max(rad,w<h?95:rad);cam.fov=w<h?55:40;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
if(reduce){rot=false;document.getElementById('tRot').checked=false;}
var t0=0;
function loop(t){
requestAnimationFrame(loop);
if(rot)th+=0.0025;
if(!reduce){ship.position.y=Math.sin(t*0.0014)*0.12;ship.rotation.z=Math.sin(t*0.0011)*0.03;}
for(var q=0;q<anim.length;q++)anim[q](t);
upd();R.render(S,cam);
}
requestAnimationFrame(loop);
})();
</script>
